name: A15 Bot B automatic intraday paper sessions

# Two consecutive weekday sessions avoid GitHub's six-hour job cap.
# This is GitHub-hosted only; NO VPS / real brokerage orders.
on:
  schedule:
    # Primary and five-minute backup attempts (weekday New York time).
    # GitHub's schedule is best effort, not an exact-time guarantee.
    - cron: '36 9 * * 1-5'
      timezone: America/New_York
    - cron: '41 9 * * 1-5'
      timezone: America/New_York
    - cron: '54 12 * * 1-5'
      timezone: America/New_York
    - cron: '59 12 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a15-b-paper-sessions
  cancel-in-progress: false

jobs:
  simulate-paper-only:
    # Prevent spending private-repo minutes. Starts only AFTER owner makes
    # repo public; use standard ubuntu-latest, which is free for public repos.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 225
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
      SCHEDULE_CRON: ${{ github.event.schedule }}
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Choose bounded regular-hours session (not an always-on service)
        id: preflight
        shell: bash
        run: |
          python - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(ZoneInfo("America/New_York"))
          cron=os.environ.get("SCHEDULE_CRON","")
          # Morning and afternoon; manual runs end at whichever segment boundary follows.
          if cron.startswith(("36 9", "41 9")):
              cutoff=(12,52)
          elif cron.startswith(("54 12", "59 12")):
              cutoff=(15,55)
          elif (now.hour,now.minute)<(12,52):
              cutoff=(12,52)
          else:
              cutoff=(15,55)
          end=now.replace(hour=cutoff[0],minute=cutoff[1],second=0,microsecond=0)
          remaining=int((end-now).total_seconds())
          valid=now.weekday()<5 and (9,35)<=(now.hour,now.minute)<(15,55) and remaining>120
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write(f"run={'true' if valid else 'false'}\n")
              o.write(f"seconds={max(0,remaining)}\n")
          print(f"NY now={now.isoformat()} segment ends={end.isoformat()}, run={valid}, seconds={max(0,remaining)}")
          PY
      - name: Restore and verify original strategy; run offline unit tests
        if: steps.preflight.outputs.run == 'true'
        run: |
          python restore_strategy.py
          python -m unittest discover -s tests -q
      - name: Verify market-data secrets are present
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -z "$APCA_API_KEY_ID" || -z "$APCA_API_SECRET_KEY" ]]; then
            echo "Missing repository secrets: APCA_API_KEY_ID / APCA_API_SECRET_KEY" >&2
            exit 1
          fi
      - name: Restore most recent A15 paper ledger from Actions artifact
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          # Preserve the $1,200 account between independent GitHub-hosted jobs.
          # This artifact contains only simulated trades; never commit it.
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "a15-b-paper-ledger" and .expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" -n a15-b-paper-ledger -D state
          fi
          ls -la state/
      - name: Paper trade the entire A15 with 15-second re-evaluation and simulated order-on-fill
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        env:
          DURATION: ${{ steps.preflight.outputs.seconds }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=INT --kill-after=35s "$DURATION" \
            python -u run_realtime_bot_b.py \
              --capital 1200 \
              --ledger state/a15_b_realtime_paper_1200.sqlite \
              --feed iex \
              --poll-seconds 15 \
              --max-fills-per-day 80 \
              --allow-unverified-parity 2>&1 | tee state/a15_b_last_session.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" != 0 && "$code" != 124 && "$code" != 130 ]]; then exit "$code"; fi
          if ! grep -q '"event": "EVALUATION"' state/a15_b_last_session.log; then
            echo 'No successful A15 evaluation occurred; data may be missing or stale. See NO_TRADE lines.' >&2
            exit 1
          fi
      - name: Checkpoint SQLite before preserving the ledger
        if: always() && steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,os
          p='state/a15_b_realtime_paper_1200.sqlite'
          if os.path.isfile(p):
              con=sqlite3.connect(p,timeout=30)
              con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              count=con.execute("SELECT count(*) FROM events WHERE event_type='fill'").fetchone()[0]
              print(f"Total persisted simulated fills: {count}")
              con.close()
          else:
              print("No paper ledger was created: market data may be incomplete. Inspect log.")
          PY
      - name: Save virtual cash, positions and fills for the next session
        if: always() && steps.preflight.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a15-b-paper-ledger
          path: |
            state/a15_b_realtime_paper_1200.sqlite
            state/a15_b_realtime_paper_1200.sqlite-wal
            state/a15_b_realtime_paper_1200.sqlite-shm
          if-no-files-found: warn
          retention-days: 60
